[project]
name = "gemini-cli-tool-agent"
version = "0.1.0"
description = "Gemini CLI as a sandboxed tool inside a Google ADK pipeline"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.18",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["litellm>=1.50"]   # Ollama / Groq / OpenRouter orchestrator backends
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
