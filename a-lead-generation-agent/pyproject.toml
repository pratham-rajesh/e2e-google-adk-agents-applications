[project]
name = "lead-gen-agent"
version = "0.1.0"
description = "Deep-research lead generation agent built with Google ADK"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.18",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
